name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The scenarios also run against the first commit, read with git.
          fetch-depth: 0
      # QB64 2.0.2, the last release of the line the suite was written
      # against, checked against the hash taken when this was written.
      - name: Install QB64 2.0.2
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\qb64.7z"
          Invoke-WebRequest https://github.com/QB64Team/qb64/releases/download/v2.0.2/qb64_2021-11-07-02-59-30_4d85302_win-x64.7z -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne '19F671FA6B194F73899602F6C93813D7B30D69C861D33957512261E06B77910E') {
            throw "QB64 download has SHA-256 $hash, not the one recorded here"
          }
          7z x $archive "-o$env:RUNNER_TEMP" | Out-Null
          "QB64=$env:RUNNER_TEMP\qb64\qb64.exe" >> $env:GITHUB_ENV
      # The baseline is named as the root commit rather than left to the
      # default, main: a checkout has no local main, and once this branch is
      # merged main is no longer the original anyway.
      - run: tests\run.ps1 -Baseline (git rev-list --max-parents=0 HEAD)
        shell: powershell
